---
- name: Správa uživatelů a ssh
  hosts: dwalin
  become: yes
  tasks:
    - name: Správa systémového uživatele
      ansible.builtin.user:
        name: "{{ admin_username }}"
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Správa SSH autorizovaných klíčů
      ansible.posix.authorized_key:
        user: "{{ admin_username }}"
        state: present
        key: "{{ admin_ssh_keys | join('\n') }}"
      when: admin_ssh_keys | length > 0
