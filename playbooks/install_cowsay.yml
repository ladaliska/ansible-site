---
- name: Instalace EPEL a cowsay na server
  hosts: staging_servers
  become: true

  tasks:
    - name: Přidání EPEL repozitáře
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Instalace balíčku cowsay
      ansible.builtin.dnf:
        name: cowsay
        state: present
